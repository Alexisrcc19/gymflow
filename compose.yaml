services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymflow
      POSTGRES_USER: gymflow
      POSTGRES_PASSWORD: gymflow_dev
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gymflow -d gymflow']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - gymflow-postgres-data:/var/lib/postgresql/data

volumes:
  gymflow-postgres-data:
